# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "https://github.com/antonbabenko/pre-commit-terraform"
rev = "v1.109.2"
hooks = [
  { id = "terraform_fmt" },

  { id = "terraform_validate", alias = "terraform_validate_roots", name = "Terraform validate (roots)", args = [
    "--hook-config=--retry-once-with-cleanup=true",
  ], exclude = '(^|/)modules/' },

  { id = "terraform_validate", alias = "terraform_validate_modules", name = "Terraform validate (modules)", args = [
    "--hook-config=--retry-once-with-cleanup=true",
  ], files = '(^|/)modules/[^/]+/[^/]+\.tf$' },
  { id = "terraform_docs" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "infracost", name = "Infracost", language = "system", entry = "infracost scan .", pass_filenames = false, files = '^(infra|bootstrap)/', stages = ["pre-push", "manual"] },
]

[[repos]]
repo = "https://github.com/bridgecrewio/checkov"
rev = "3.3.25"
hooks = [
  { id = "checkov", args = [
    "--framework",
    "terraform",
    "--quiet",
    "--compact",
  ] },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]


[[repos]]
repo = "local"
hooks = [
  { id = "act", name = "Run workflows locally (act)", stages = ["pre-push"], language = "system", entry = "act pull_request --rm --pull=false", pass_filenames = false, exclude = '^infra/|\.md$' },
]


[[repos]]
repo = "local"
hooks = [
  { id = "trivy", name = "Trivy scan", language = "system", entry = "trivy repo --quiet --exit-code 1 --severity HIGH,CRITICAL --scanners vuln,secret,misconfig --skip-dirs **/.terraform .", pass_filenames = false },
]

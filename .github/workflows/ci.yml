name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["infra/**", "**.md"]
  pull_request:
    paths-ignore: ["infra/**", "**.md"]
  workflow_dispatch:


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
  image:
    # Only build/push images from main or version tags, never from PRs
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
